<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Elfish Checkers — a Tolkien-inspired race of elves &amp; trolls</title>
  <meta name="description" content="Elfish Checkers: guide your seven elves across the board to the enemy's home while two grumpy trolls stomp about bonking heads. Play with a friend or against the computer.">
  <meta name="theme-color" content="#0b1a1c">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta property="og:title" content="Elfish Checkers">
  <meta property="og:description" content="White elves, black elves and two very grumpy trolls. A race across an elvish board.">
  <meta property="og:type" content="website">
  <link rel="alternate" hreflang="he" href="./?lang=he">
  <link rel="alternate" hreflang="en" href="./?lang=en">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="src/styles/index.css">
  <link rel="stylesheet" href="src/styles/board.css">
</head>
<body>
  <div class="sky" aria-hidden="true">
    <i style="--x:8%;--y:30%;--d:11s"></i>
    <i style="--x:18%;--y:70%;--d:9s;--delay:2s"></i>
    <i style="--x:30%;--y:45%;--d:13s;--delay:4s"></i>
    <i style="--x:72%;--y:28%;--d:10s;--delay:1s"></i>
    <i style="--x:84%;--y:58%;--d:12s;--delay:3s"></i>
    <i style="--x:92%;--y:82%;--d:9s;--delay:5s"></i>
    <i style="--x:60%;--y:88%;--d:14s;--delay:6s"></i>
    <i style="--x:4%;--y:90%;--d:10s;--delay:7s"></i>
  </div>

  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="-24 -24 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="g-mark" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="hsl(48 95% 80%)"/>
            <stop offset="1" stop-color="hsl(36 75% 50%)"/>
          </linearGradient>
        </defs>
        <path d="M0,-21 C13,-11 13,11 0,21 C-13,11 -13,-11 0,-21Z" fill="url(#g-mark)"/>
        <path d="M0,-17 L0,19 M0,-6 L-6,-11 M0,-6 L6,-11 M0,3 L-7,-2 M0,3 L7,-2 M0,12 L-6,7 M0,12 L6,7"
              stroke="hsl(176 50% 18%)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      </svg>
      <div>
        <h1 data-i18n="title">Elfish Checkers</h1>
        <p class="tagline" data-i18n="tagline">White elves · Black elves · Two very grumpy trolls</p>
      </div>
    </div>
    <nav class="actions" data-i18n-aria="actionsLabel" aria-label="Game actions">
      <button id="btn-lang" class="btn btn--lang" type="button" data-i18n-aria="langSwitchLabel" aria-label="החלפה לעברית">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <span data-i18n="langSwitch" lang="">עברית</span>
      </button>
      <button id="btn-rules" class="btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>
        <span data-i18n="rules">Rules</span>
      </button>
      <button id="btn-undo" class="btn" type="button" data-i18n-title="undoTitle" title="Undo (U)">
        <svg class="flip-rtl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
        <span data-i18n="undo">Undo</span>
      </button>
      <button id="btn-new" class="btn btn--primary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span data-i18n="newGame">New game</span>
      </button>
    </nav>
  </header>

  <main class="layout">
    <aside class="player" id="card-B" data-team="B" data-i18n-aria="team_B" aria-label="Black Elves">
      <div class="player-head">
        <span class="player-token" aria-hidden="true"></span>
        <div>
          <h2 class="player-name"><span data-i18n="team_B">Black Elves</span><span class="player-role"></span></h2>
          <p class="player-sub" data-i18n="sub_B">Moriquendi · Elves of the Darkness</p>
        </div>
        <span class="turn-badge"></span>
      </div>
      <div class="pips" role="img"></div>
      <p class="player-meta"></p>
    </aside>

    <section class="board-wrap" data-i18n-aria="boardLabel" aria-label="Game board">
      <svg id="board" dir="ltr" data-i18n-aria="boardSvgLabel" aria-label="Elfish Checkers board"></svg>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <aside class="player" id="card-W" data-team="W" data-i18n-aria="team_W" aria-label="White Elves">
      <div class="player-head">
        <span class="player-token" aria-hidden="true"></span>
        <div>
          <h2 class="player-name"><span data-i18n="team_W">White Elves</span><span class="player-role"></span></h2>
          <p class="player-sub" data-i18n="sub_W">Calaquendi · Elves of the Light</p>
        </div>
        <span class="turn-badge"></span>
      </div>
      <div class="pips" role="img"></div>
      <p class="player-meta"></p>
    </aside>
  </main>

  <footer class="settings">
    <fieldset class="segmented">
      <legend class="sr-only" data-i18n="modeLabel">Game mode</legend>
      <label><input type="radio" name="mode" value="pvp" id="mode-pvp"> <span data-i18n="modePvp">2 Players</span></label>
      <label><input type="radio" name="mode" value="ai" id="mode-ai"> <span data-i18n="modeAi">vs Computer</span></label>
    </fieldset>
    <div id="ai-options" class="ai-options" hidden>
      <label><span data-i18n="youPlay">You play</span>
        <select id="side">
          <option value="W" data-i18n="white">White</option>
          <option value="B" data-i18n="black">Black</option>
        </select>
      </label>
      <label><span data-i18n="difficulty">Difficulty</span>
        <select id="level">
          <option value="easy" data-i18n="easy">Easy</option>
          <option value="normal" data-i18n="normal">Normal</option>
          <option value="hard" data-i18n="hard">Hard</option>
        </select>
      </label>
    </div>
  </footer>

  <dialog id="rules-dialog" aria-labelledby="rules-title">
    <div class="dialog-body">
      <h2 id="rules-title" data-i18n="rulesTitle">How to play</h2>
      <p class="lede" data-i18n="rulesLede"></p>
      <ul class="rules-list">
        <li><span class="ico">1</span><span data-i18n-html="rule1"></span></li>
        <li><span class="ico">2</span><span data-i18n-html="rule2"></span></li>
        <li><span class="ico">3</span><span data-i18n-html="rule3"></span></li>
        <li><span class="ico">4</span><span data-i18n-html="rule4"></span></li>
        <li><span class="ico">5</span><span data-i18n-html="rule5"></span></li>
        <li><span class="ico">6</span><span data-i18n-html="rule6"></span></li>
        <li><span class="ico">7</span><span data-i18n-html="rule7"></span></li>
      </ul>
      <form method="dialog" class="dialog-actions">
        <button class="btn btn--primary" id="btn-rules-close" data-i18n="gotIt">Got it</button>
      </form>
    </div>
  </dialog>

  <dialog id="win-dialog" aria-labelledby="win-title">
    <div class="dialog-body win-body">
      <div class="win-token" id="win-token" aria-hidden="true"></div>
      <h2 id="win-title"></h2>
      <p class="win-quote" id="win-quote" lang="qya" dir="ltr"></p>
      <p class="win-trans" id="win-trans"></p>
      <div class="dialog-actions">
        <form method="dialog"><button class="btn" id="btn-view-board" data-i18n="viewBoard">View board</button></form>
        <button class="btn btn--primary" id="btn-again" type="button" data-i18n="playAgain">Play again</button>
      </div>
    </div>
  </dialog>
  <script defer src="bundle.js"></script>
</body>
</html>
